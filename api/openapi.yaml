openapi: 3.1.0
info:
  title: Overfin API
  version: 1.0.0-draft
  license:
    name: MIT
    identifier: MIT
  description: |
    Overfin is a secure gateway in front of a Jellyfin server (and optionally
    Seerr). Websites and apps use this API; they never talk to Jellyfin
    directly. See SECURITY.md and THREAT_MODEL.md for the rules behind it.

    ## Conventions

    These apply to every endpoint.

    **Format.** Requests and responses are JSON (`application/json`, UTF-8),
    except media, images and subtitles. Field names are `camelCase`.

    **Versioning.** All routes live under `/api/v1/`. Within v1, changes are
    only additive: new endpoints, new optional fields, new enum values.
    Breaking changes go to a new version, and the old one keeps running for a
    while.

    **Forward compatibility.** Clients must ignore fields they don't know and
    must handle enum values they don't know (for example a new item `kind`).
    This is what makes additive changes safe.

    **IDs.** IDs are opaque strings with a type prefix, such as `item_…`,
    `prof_…` or `play_…`. Clients must not parse them or build them, and an
    ID of the wrong type is rejected.

    **Missing values.** Optional fields that have no value are left out
    instead of being `null`. Lists are `[]` when empty, never `null`.

    **Time.** Durations and playback positions are integer milliseconds
    (`durationMs`, `positionMs`). Timestamps are RFC 3339 in UTC
    (`2026-10-18T21:04:00Z`). Calendar dates without a time, such as premiere
    dates, are `YYYY-MM-DD`.

    **Pagination.** List endpoints take `limit` and `cursor` and return a
    `Page`: the `items`, a `nextCursor` (absent on the last page) and, where
    known, a `totalCount`. Cursors are opaque.

    **Browsing and search.** Browse filters are `GET` query parameters, so a
    page of results can be linked and reloaded. Free-text search is a `POST`
    with the terms in the body, so they stay out of URLs and access logs.

    **Errors.** Errors use RFC 9457 problem details
    (`application/problem+json`). The `type` is a short, stable name such as
    `stream-limit-reached`; clients should branch on `type`, never on `detail`.
    Anything the caller may not see is reported as `not-found`.

    **Language.** Metadata comes in the language of the `Accept-Language`
    header, unless the active profile sets its own.

    **Step-up.** Some actions need a fresh confirmation. Overfin then answers
    with a `step-up-required` error naming what is needed (`pin` or `login`)
    and, for a login, a `stepUpUrl` to send the user to. After confirming, the
    client retries the same request. A confirmed login stays fresh for a few
    minutes.

servers:
  - url: /api/v1

security:
  - session: []

paths:
  /health:
    get:
      operationId: getHealth
      summary: Check that the gateway is running
      tags: [system]
      security: []
      responses:
        "200":
          description: The gateway is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]

  /info:
    get:
      operationId: getInfo
      summary: Describe this Overfin instance
      description: |
        Public, so a site can adapt before anyone logs in. It describes
        features and settings only; it never reveals software versions,
        upstream servers or anything about users.
      tags: [system]
      security: []
      responses:
        "200":
          description: Instance information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Info"

  /me:
    get:
      operationId: getMe
      summary: The current account and active profile
      tags: [account]
      responses:
        "200":
          description: The current account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: deleteAccount
      summary: Delete the account and everything Overfin holds about it
      description: Needs a fresh login. What happens to the Jellyfin and Seerr
        users is the operator's choice, reported in `Info.accountDeletion`.
      tags: [account]
      responses:
        "204":
          description: The account is deleted and the session ended.
        "403":
          $ref: "#/components/responses/StepUpRequired"

  /me/export:
    post:
      operationId: exportMyData
      summary: Download everything Overfin holds about this account
      description: Needs a fresh login. Secrets (tokens, PIN hashes, keys)
        are never included.
      tags: [account]
      responses:
        "200":
          description: The account's data.
          content:
            application/json:
              schema:
                type: object
                description: Format documented separately; stable within v1.
        "403":
          $ref: "#/components/responses/StepUpRequired"

  /logout:
    post:
      operationId: logout
      summary: End the current session
      tags: [account]
      responses:
        "200":
          description: The session is ended. To also leave the identity
            provider, send the user to `logoutUrl`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  logoutUrl:
                    type: string
                    format: uri

  /profiles:
    get:
      operationId: listProfiles
      summary: List the account's profiles
      tags: [profiles]
      responses:
        "200":
          description: The profiles, owner first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Profile"
    post:
      operationId: createProfile
      summary: Create a profile
      description: Owner profile only.
      tags: [profiles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileCreate"
      responses:
        "201":
          description: The new profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "409":
          $ref: "#/components/responses/Conflict"

  /profiles/{profileId}:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    get:
      operationId: getProfile
      summary: Get one profile
      tags: [profiles]
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProfile
      summary: Change some of a profile's settings
      description: Owner profile only. Changing a kids profile's
        `ratingCeiling` needs the PIN.
      tags: [profiles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: The updated profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "403":
          $ref: "#/components/responses/StepUpRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteProfile
      summary: Delete a profile and its history
      description: Owner profile only, and needs a fresh login. The owner
        profile itself can't be deleted; delete the account instead.
      tags: [profiles]
      responses:
        "204":
          description: The profile is deleted.
        "403":
          $ref: "#/components/responses/StepUpRequired"
        "404":
          $ref: "#/components/responses/NotFound"

  /profiles/{profileId}/activate:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    post:
      operationId: activateProfile
      summary: Switch this session to a profile ("Who's watching?")
      tags: [profiles]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pin:
                  $ref: "#/components/schemas/Pin"
      responses:
        "200":
          description: The profile is now active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "403":
          $ref: "#/components/responses/StepUpRequired"
        "404":
          $ref: "#/components/responses/NotFound"

  /profiles/{profileId}/pin:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    put:
      operationId: setProfilePin
      summary: Set or change a profile's PIN
      description: Owner profile only. Changing an existing PIN needs a fresh
        login.
      tags: [profiles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin:
                  $ref: "#/components/schemas/Pin"
      responses:
        "204":
          description: The PIN is set.
        "403":
          $ref: "#/components/responses/StepUpRequired"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: removeProfilePin
      summary: Remove a profile's PIN
      description: Owner profile only, and needs a fresh login.
      tags: [profiles]
      responses:
        "204":
          description: The PIN is removed.
        "403":
          $ref: "#/components/responses/StepUpRequired"
        "404":
          $ref: "#/components/responses/NotFound"

  /profiles/{profileId}/avatar:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    put:
      operationId: setProfileAvatar
      summary: Upload a profile picture
      description: |
        Owner profile only. The upload is checked for size and dimensions
        before decoding, then re-encoded into fixed square sizes with all
        metadata (including location) removed. Rate-limited.
      tags: [profiles]
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: The profile with its new avatar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedImage"
    delete:
      operationId: removeProfileAvatar
      summary: Remove a profile picture
      description: Owner profile only.
      tags: [profiles]
      responses:
        "204":
          description: The avatar is removed.
        "404":
          $ref: "#/components/responses/NotFound"

  /profiles/{profileId}/transfer:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    post:
      operationId: startProfileTransfer
      summary: Create a code to move this profile to another account
      description: Owner profile only, and needs a fresh login. The code is
        single-use and expires within minutes. The owner profile can't be
        transferred.
      tags: [profiles]
      responses:
        "201":
          description: The transfer code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferCode"
        "403":
          $ref: "#/components/responses/StepUpRequired"
        "404":
          $ref: "#/components/responses/NotFound"

  /transfers/accept:
    post:
      operationId: acceptProfileTransfer
      summary: Receive a profile into this account with a transfer code
      description: Owner profile only. If the account already has a profile
        with the same name, `name` must give a new one.
      tags: [profiles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  maxLength: 64
                name:
                  $ref: "#/components/schemas/ProfileName"
      responses:
        "200":
          description: The profile now belongs to this account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /sessions:
    get:
      operationId: listSessions
      summary: List this account's sessions and devices
      tags: [account]
      responses:
        "200":
          description: The sessions, current one first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"
    delete:
      operationId: endAllOtherSessions
      summary: End every session of this account except the current one
      tags: [account]
      responses:
        "204":
          description: The other sessions are ended.

  /sessions/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
    delete:
      operationId: endSession
      summary: End one of this account's sessions
      tags: [account]
      responses:
        "204":
          description: The session is ended.
        "404":
          $ref: "#/components/responses/NotFound"

  # ---- Library ---------------------------------------------------------------

  /libraries:
    get:
      operationId: listLibraries
      summary: The libraries the active profile can see
      tags: [library]
      responses:
        "200":
          description: The libraries.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Library"

  /items:
    get:
      operationId: queryItems
      summary: List items, filtered and sorted
      description: |
        Every listing is a query on this endpoint: a library's movies, a
        series' seasons (`parent`), an album's tracks, a genre, a person's
        work, unwatched items, and so on. Results are already limited to what
        the active profile may see.
      tags: [library]
      parameters:
        - name: library
          in: query
          schema:
            type: string
            maxLength: 64
        - name: kind
          in: query
          description: One or more item kinds; repeat the parameter for several.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 10
            items:
              $ref: "#/components/schemas/ItemKind"
        - name: parent
          in: query
          description: Only direct children of this item, e.g. a series'
            seasons or an album's tracks.
          schema:
            type: string
            maxLength: 64
        - name: genre
          in: query
          description: Genre name; repeat for several (items matching any).
          style: form
          explode: true
          schema:
            type: array
            maxItems: 10
            items:
              type: string
              maxLength: 64
        - name: person
          in: query
          schema:
            type: string
            maxLength: 64
        - name: studio
          in: query
          schema:
            type: string
            maxLength: 128
        - name: yearFrom
          in: query
          schema:
            type: integer
            minimum: 1800
            maximum: 9999
        - name: yearTo
          in: query
          schema:
            type: integer
            minimum: 1800
            maximum: 9999
        - name: played
          in: query
          schema:
            type: boolean
        - name: favorite
          in: query
          schema:
            type: boolean
        - name: inProgress
          in: query
          schema:
            type: boolean
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, premiereDate, addedAt, communityRating, lastPlayed, random]
            default: name
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - $ref: "#/components/parameters/Seed"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPage"

  /items/resume:
    get:
      operationId: listResumeItems
      summary: Items started but not finished
      tags: [library]
      parameters:
        - name: kind
          in: query
          style: form
          explode: true
          schema:
            type: array
            maxItems: 10
            items:
              $ref: "#/components/schemas/ItemKind"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Most recently played first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPage"

  /items/next-up:
    get:
      operationId: listNextUp
      summary: The next episode to watch for each series in progress
      tags: [library]
      parameters:
        - name: series
          in: query
          description: Only this series.
          schema:
            type: string
            maxLength: 64
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of episodes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPage"

  /items/latest:
    get:
      operationId: listLatest
      summary: Recently added items
      description: New episodes of the same series are grouped into one entry
        for the series.
      tags: [library]
      parameters:
        - name: library
          in: query
          schema:
            type: string
            maxLength: 64
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ItemSummary"

  /items/{itemId}:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      operationId: getItem
      summary: Everything about one item, for its detail page
      tags: [library]
      responses:
        "200":
          description: The item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "404":
          $ref: "#/components/responses/NotFound"

  /items/{itemId}/similar:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      operationId: listSimilar
      summary: Items like this one
      description: Where the suggestions come from (Jellyfin, TMDB, or
        Overfin's own scoring) is the operator's choice; the shape is always
        the same.
      tags: [library]
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Similar items in the library.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ItemSummary"
        "404":
          $ref: "#/components/responses/NotFound"

  /items/{itemId}/favorite:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    put:
      operationId: addFavorite
      summary: Mark as a favorite of the active profile
      tags: [library]
      responses:
        "200":
          $ref: "#/components/responses/UserStateChanged"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: removeFavorite
      summary: Unmark as a favorite
      tags: [library]
      responses:
        "200":
          $ref: "#/components/responses/UserStateChanged"
        "404":
          $ref: "#/components/responses/NotFound"

  /items/{itemId}/played:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    put:
      operationId: markPlayed
      summary: Mark as watched or listened to
      description: On a series, season or album, marks all of its children.
      tags: [library]
      responses:
        "200":
          $ref: "#/components/responses/UserStateChanged"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: markUnplayed
      summary: Mark as not watched
      tags: [library]
      responses:
        "200":
          $ref: "#/components/responses/UserStateChanged"
        "404":
          $ref: "#/components/responses/NotFound"

  /items/{itemId}/lyrics:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      operationId: getLyrics
      summary: A track's lyrics, timed when available
      tags: [library]
      responses:
        "200":
          description: The lyrics, as plain text lines.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lyrics"
        "404":
          $ref: "#/components/responses/NotFound"

  /items/{itemId}/trickplay:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      operationId: getTrickplay
      summary: Seek-bar preview thumbnails
      tags: [library]
      responses:
        "200":
          description: The available preview sets.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Trickplay"
        "404":
          $ref: "#/components/responses/NotFound"

  /genres:
    get:
      operationId: listGenres
      summary: Genres, for filter menus
      tags: [library]
      parameters:
        - name: library
          in: query
          schema:
            type: string
            maxLength: 64
      responses:
        "200":
          description: Genres, by name.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Genre"

  /people/{personId}:
    parameters:
      - name: personId
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
    get:
      operationId: getPerson
      summary: A person's page
      description: Their work is listed with `GET /items?person=…`.
      tags: [library]
      responses:
        "200":
          description: The person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "404":
          $ref: "#/components/responses/NotFound"

  /search:
    post:
      operationId: search
      summary: Search the library and, when enabled, the TMDB catalog
      description: |
        Terms travel in the body so they stay out of URLs and logs. Results
        come in labeled sections; a site can show them together or apart, or
        ask for only one with `sources`. The `catalog` section exists only
        when the operator has enabled the TMDB catalog, and its titles carry
        request status only when requests are enabled too.
      tags: [library]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: The results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"

  /images/{imageId}:
    parameters:
      - name: imageId
        in: path
        required: true
        schema:
          type: string
          maxLength: 128
    get:
      operationId: getImage
      summary: An image, re-encoded and access-checked
      description: Use the URL from an `ImageRef`. Sizes come from
        `Info.imageSizes`. Checked against the active profile on every
        request, also when cached.
      tags: [library]
      parameters:
        - name: size
          in: query
          schema:
            type: string
            enum: [small, medium, large]
            default: medium
      responses:
        "200":
          description: The image.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"

  /trickplay/{sheetId}:
    parameters:
      - name: sheetId
        in: path
        required: true
        schema:
          type: string
          maxLength: 128
    get:
      operationId: getTrickplaySheet
      summary: One sheet of seek-bar previews
      description: Use a URL from `Trickplay.sheets`. Checked against the
        active profile like any image.
      tags: [library]
      responses:
        "200":
          description: The sheet.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"

  # ---- Playback --------------------------------------------------------------

  /playback:
    post:
      operationId: startPlayback
      summary: Start playing an item
      description: |
        The client describes what it can play; Overfin picks the cheapest
        way (direct play, repackaging, or transcoding) and returns a playback
        session with the stream URL, tracks and skip markers.

        If the account is at its stream limit, its oldest playback is ended
        and that device is told why (unless the operator chose to refuse new
        streams). Overfin never ends another account's playback.
      tags: [playback]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaybackStart"
      responses:
        "201":
          description: The playback session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackSession"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The account is at its stream limit and the operator
            refuses new streams (`stream-limit-reached`), or the item can't be
            played (`not-playable`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: The server is busy and no cheaper way to play exists
            (`server-busy`). Try again later.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /playback/current:
    get:
      operationId: getCurrentPlayback
      summary: This session's active playback, to restore it after a reload
      tags: [playback]
      responses:
        "200":
          description: The active playback session, with its position, tracks
            and queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackSession"
        "404":
          $ref: "#/components/responses/NotFound"

  /playback/bitrate-test:
    get:
      operationId: bitrateTest
      summary: Download test bytes to measure bandwidth
      description: Served by Overfin itself, so it measures the real path
        between the viewer and the server. Rate-limited.
      tags: [playback]
      parameters:
        - name: sizeKb
          in: query
          schema:
            type: integer
            minimum: 64
            maximum: 10240
            default: 1024
      responses:
        "200":
          description: Random bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /playback/{playbackId}:
    parameters:
      - $ref: "#/components/parameters/PlaybackId"
    get:
      operationId: getPlayback
      summary: Get a playback session
      tags: [playback]
      responses:
        "200":
          description: The playback session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackSession"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/PlaybackEnded"
    patch:
      operationId: changePlayback
      summary: Switch audio, subtitles, version or quality
      description: When the change needs a different stream, the response has
        a new `stream.url`; the client switches to it at its current
        position.
      tags: [playback]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaybackChange"
      responses:
        "200":
          description: The updated playback session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackSession"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/PlaybackEnded"

  /playback/{playbackId}/progress:
    parameters:
      - $ref: "#/components/parameters/PlaybackId"
    post:
      operationId: reportProgress
      summary: Report the position, every few seconds while playing
      description: Keeps the stream ticket alive and saves progress. Playback
        that stops reporting is ended and its transcode stopped.
      tags: [playback]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressReport"
      responses:
        "204":
          description: Recorded.
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/PlaybackEnded"

  /playback/{playbackId}/stop:
    parameters:
      - $ref: "#/components/parameters/PlaybackId"
    post:
      operationId: stopPlayback
      summary: Stop playing; saves the final position and ends any transcode
      tags: [playback]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressReport"
      responses:
        "204":
          description: Stopped.
        "404":
          $ref: "#/components/responses/NotFound"

  /playback/{playbackId}/queue:
    parameters:
      - $ref: "#/components/parameters/PlaybackId"
    put:
      operationId: setQueue
      summary: Replace the play queue
      tags: [playback]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemIds]
              properties:
                itemIds:
                  type: array
                  maxItems: 1000
                  items:
                    type: string
                    maxLength: 64
      responses:
        "200":
          description: The playback session with its new queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackSession"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/PlaybackEnded"

  /playback/{playbackId}/advance:
    parameters:
      - $ref: "#/components/parameters/PlaybackId"
    post:
      operationId: advanceQueue
      summary: Move to another queue entry (next episode, next track, a jump)
      description: Ends the current item and starts the chosen one, keeping
        the queue. Returns the new playback session.
      tags: [playback]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [index]
              properties:
                index:
                  type: integer
                  minimum: 0
      responses:
        "201":
          description: The playback session for the new entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackSession"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/PlaybackEnded"

  /stream/{ticket}/{name}:
    parameters:
      - $ref: "#/components/parameters/Ticket"
      - name: name
        in: path
        required: true
        description: A file name from the stream, e.g. `master.m3u8` or a
          segment name from the playlist. Clients only use names that appear
          in Overfin's playlists or in `stream.url`.
        schema:
          type: string
          maxLength: 128
          pattern: "^[A-Za-z0-9._-]+$"
    get:
      operationId: getStream
      summary: Playlists, segments or the media file
      description: Supports `Range` requests for seeking. The ticket is
        short-lived, bound to the session and renewed by progress reports.
      tags: [playback]
      responses:
        "200":
          description: The media or playlist.
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
            video/*:
              schema:
                type: string
                format: binary
            audio/*:
              schema:
                type: string
                format: binary
        "206":
          description: Part of the media, for a `Range` request.
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/PlaybackEnded"

  /stream/{ticket}/subtitles/{trackId}:
    parameters:
      - $ref: "#/components/parameters/Ticket"
      - name: trackId
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
    get:
      operationId: getSubtitles
      summary: A subtitle track as sanitized WebVTT
      tags: [playback]
      responses:
        "200":
          description: The subtitles.
          content:
            text/vtt:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"

  # ---- Catalog (TMDB plugin) -------------------------------------------------
  #
  # These exist only when the operator enables the TMDB catalog (`catalog` in
  # `Info.features`). Overfin fetches TMDB itself and caches the results;
  # browsers never contact TMDB. Kids profiles only see titles within their
  # rating ceiling.

  /discover:
    get:
      operationId: discover
      summary: Trending, popular and upcoming titles from TMDB
      description: Filter with `availability` to get, for example, "trending
        in our library" (`library`) or "trending titles we don't have"
        (`missing`). Titles already in the library carry `libraryItemId`.
      tags: [catalog]
      parameters:
        - name: list
          in: query
          required: true
          schema:
            type: string
            description: Open set; more lists may be added.
            enum: [trending, popular, upcoming]
        - name: mediaKind
          in: query
          schema:
            type: string
            enum: [movie, series]
        - name: availability
          in: query
          schema:
            type: string
            enum: [all, library, missing]
            default: all
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of titles.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageInfo"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/CatalogTitle"

  /catalog/{mediaKind}/{tmdbId}:
    parameters:
      - name: mediaKind
        in: path
        required: true
        schema:
          type: string
          enum: [movie, series]
      - name: tmdbId
        in: path
        required: true
        schema:
          type: string
          pattern: "^[0-9]{1,12}$"
    get:
      operationId: getCatalogTitle
      summary: A title's details, with per-season status for series
      tags: [catalog]
      responses:
        "200":
          description: The title.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---- Requests (Seerr plugin) -----------------------------------------------
  #
  # These exist only when the operator enables requests (`requests` in
  # `Info.features`), which also needs the TMDB catalog. Kids profiles only
  # request titles within their rating ceiling. Approvals happen in Seerr
  # itself, never here.

  /requests:
    get:
      operationId: listMyRequests
      summary: The active profile's requests and their status
      description: The owner profile also sees the requests of the account's
        kids profiles.
      tags: [requests]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageInfo"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/MediaRequest"
    post:
      operationId: createRequest
      summary: Request a movie, or seasons of a series
      description: Counts against the account's quota. Kids profiles can only
        request titles within their rating ceiling; an unknown rating is
        refused.
      tags: [requests]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mediaKind, tmdbId]
              properties:
                mediaKind:
                  type: string
                  enum: [movie, series]
                tmdbId:
                  type: string
                  pattern: "^[0-9]{1,12}$"
                seasons:
                  type: array
                  description: For series, which seasons. Absent means all.
                  maxItems: 100
                  items:
                    type: integer
                    minimum: 0
      responses:
        "201":
          description: The request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Already requested or available (`already-requested`),
            quota used up (`quota-exceeded`), or not allowed for this profile
            (`rating-not-allowed`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /requests/quota:
    get:
      operationId: getQuota
      summary: How many requests the account has left
      tags: [requests]
      responses:
        "200":
          description: The quota.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quota"

  /requests/{requestId}:
    parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
    delete:
      operationId: cancelRequest
      summary: Cancel one of my requests while it is still pending
      tags: [requests]
      responses:
        "204":
          description: Cancelled.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: No longer pending (`not-pending`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /issues:
    get:
      operationId: listMyIssues
      summary: The active profile's problem reports, with replies
      description: Only when the operator enables conversations
        (`issueConversations` in `Info.features`).
      tags: [requests]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageInfo"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Issue"
    post:
      operationId: reportIssue
      summary: Report a problem with an item
      description: |
        Sites can offer quick choices with `kind` and `reason`; `message` is
        optional. Without conversations enabled, a report is fire-and-forget.
      tags: [requests]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueReport"
      responses:
        "201":
          description: The report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "404":
          $ref: "#/components/responses/NotFound"

  /issues/{issueId}/comments:
    parameters:
      - name: issueId
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
    post:
      operationId: commentOnIssue
      summary: Reply in one of my problem reports
      description: Only when the operator enables conversations.
      tags: [requests]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        "201":
          description: The report with the new comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-overfin
      description: Session cookie set by Overfin. With forward-auth, the
        reverse proxy authenticates every request before it reaches Overfin.

  parameters:
    Limit:
      name: limit
      in: query
      description: Maximum number of items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: The `nextCursor` from the previous page.
      schema:
        type: string
        maxLength: 512
    Seed:
      name: seed
      in: query
      description: For `sort=random`, makes the shuffle repeatable, so a
        shuffled list survives a reload. Without it, the server picks one and
        returns it in the page.
      schema:
        type: string
        maxLength: 32
        pattern: "^[A-Za-z0-9]+$"
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
        examples: [item_7f3a9c04b1e2]
    PlaybackId:
      name: playbackId
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
        examples: [play_9m2k7w4q1x8c]
    Ticket:
      name: ticket
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
        pattern: "^[A-Za-z0-9_-]+$"
    ProfileId:
      name: profileId
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
        examples: [prof_3kq9x2m8w7v1]

  schemas:
    Problem:
      description: An error, as RFC 9457 problem details.
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          description: Stable, machine-readable error name.
          examples: [stream-limit-reached]
        title:
          type: string
          description: Short human-readable summary, the same for every
            occurrence of this type.
        status:
          type: integer
          description: The HTTP status code.
        detail:
          type: string
          description: Human-readable explanation of this occurrence. Never
            parse it.
        stepUp:
          type: string
          description: For `step-up-required`, what is needed. Open set.
          examples: [pin, login]
        stepUpUrl:
          type: string
          format: uri-reference
          description: For `step-up-required` with `login`, where to send the
            user to confirm.

    # ---- System and account --------------------------------------------------

    Info:
      description: What this instance offers. Never includes software
        versions, upstream details or user data.
      type: object
      required: [apiVersion, features]
      properties:
        name:
          type: string
          description: The instance's display name, as set by the operator.
        apiVersion:
          type: string
          description: The API level, e.g. `1.3`. Not a software version.
          examples: ["1.0"]
        features:
          type: array
          description: Enabled features. Open set; clients ignore unknown
            values.
          items:
            type: string
          examples: [[profiles, catalog, requests, music]]
        attributions:
          type: array
          description: Data sources whose terms require the site to credit
            them, e.g. `tmdb` when the TMDB catalog is enabled. Open set.
          items:
            type: string
          examples: [[tmdb]]
        login:
          type: object
          properties:
            url:
              type: string
              format: uri-reference
              description: Where to send a user who isn't logged in.
        imageSizes:
          type: array
          description: The sizes images can be requested in.
          items:
            type: string
          examples: [[small, medium, large]]
        ratingsCountry:
          type: string
          description: ISO 3166-1 country whose age ratings kids profiles use.
          examples: [CA]
        maxProfilesPerAccount:
          type: integer
          minimum: 0
        maxStreamsPerAccount:
          type: integer
          minimum: 0
        accountDeletion:
          type: string
          description: What deleting an account does to its media server
            users. Open set.
          examples: [delete, disable]

    Me:
      type: object
      required: [accountId, activeProfile]
      properties:
        accountId:
          type: string
          examples: [acct_8w2n5k1q9z3r]
        displayName:
          type: string
          description: From the identity provider, when it provides one.
        activeProfile:
          $ref: "#/components/schemas/Profile"

    ProfileName:
      type: string
      minLength: 1
      maxLength: 32
      description: Unique within the account.

    Pin:
      type: string
      pattern: "^[0-9]{4,8}$"

    Profile:
      type: object
      required: [id, name, kind, owner, hasPin]
      properties:
        id:
          type: string
          examples: [prof_3kq9x2m8w7v1]
        name:
          $ref: "#/components/schemas/ProfileName"
        kind:
          type: string
          description: Open set; clients must handle unknown values.
          examples: [standard, kids]
        owner:
          type: boolean
          description: The account's owner profile, which manages the others.
        hasPin:
          type: boolean
        avatar:
          $ref: "#/components/schemas/ImageRef"
        language:
          type: string
          description: Preferred metadata language (BCP 47), overriding
            `Accept-Language`.
          examples: [fr-CA]
        ratingCeiling:
          type: string
          description: For kids profiles, the highest age rating allowed, in
            the instance's ratings country.
          examples: [PG]

    ProfileCreate:
      type: object
      required: [name, kind]
      properties:
        name:
          $ref: "#/components/schemas/ProfileName"
        kind:
          type: string
          enum: [standard, kids]
        language:
          type: string
        ratingCeiling:
          type: string

    ProfileUpdate:
      description: Only the fields sent are changed.
      type: object
      minProperties: 1
      properties:
        name:
          $ref: "#/components/schemas/ProfileName"
        language:
          type: string
        ratingCeiling:
          type: string
        pin:
          description: Required when changing `ratingCeiling` on a profile
            with a PIN.
          $ref: "#/components/schemas/Pin"

    TransferCode:
      type: object
      required: [code, expiresAt]
      properties:
        code:
          type: string
        expiresAt:
          $ref: "#/components/schemas/Timestamp"

    Session:
      description: One of the account's own sessions.
      type: object
      required: [id, current, createdAt]
      properties:
        id:
          type: string
          examples: [sess_6p1m4t8c2x9b]
        current:
          type: boolean
        device:
          type: string
          description: A readable device description, e.g. `Firefox on
            Linux`.
        profileName:
          type: string
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        lastActiveAt:
          $ref: "#/components/schemas/Timestamp"

    PageInfo:
      description: Paging fields shared by every list response.
      type: object
      properties:
        nextCursor:
          type: string
          description: Pass as `cursor` to get the next page. Absent on the
            last page.
        totalCount:
          type: integer
          minimum: 0
          description: Total number of matching items, when known.

    Milliseconds:
      type: integer
      minimum: 0
      description: A duration or position in milliseconds.

    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 timestamp in UTC.

    CalendarDate:
      type: string
      format: date
      description: A calendar date without time or time zone (`YYYY-MM-DD`).

    # ---- Items -------------------------------------------------------------
    #
    # Every item has the same small core, plus one nested object named after
    # its kind ("episode", "track", ...) holding the kind-specific fields.
    # Clients skip kinds they don't know.

    ItemKind:
      type: string
      description: |
        What an item is. New kinds may be added in v1; clients must skip
        items whose kind they don't know.
      examples: [episode]
      enum:
        - movie
        - series
        - season
        - episode
        - collection
        - video
        - musicVideo
        - musicArtist
        - musicAlbum
        - track
        - playlist
        - audiobook
        - book
        - photo
        - photoAlbum
        - liveChannel
        - liveProgram
        - recording

    ImageRef:
      description: |
        An image, served by Overfin. Request it at `url` with a `size` from
        the fixed list documented on the image endpoint.
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri-reference
        aspectRatio:
          type: number
          exclusiveMinimum: 0
          description: Width divided by height.
        blurHash:
          type: string
          maxLength: 128
          description: A tiny placeholder to show while the image loads
            (BlurHash format).

    Images:
      type: object
      properties:
        primary:
          $ref: "#/components/schemas/ImageRef"
        backdrops:
          type: array
          items:
            $ref: "#/components/schemas/ImageRef"
        logo:
          $ref: "#/components/schemas/ImageRef"
        thumb:
          $ref: "#/components/schemas/ImageRef"

    UserState:
      description: The active profile's state for this item. Never anyone
        else's.
      type: object
      properties:
        positionMs:
          $ref: "#/components/schemas/Milliseconds"
        played:
          type: boolean
        playCount:
          type: integer
          minimum: 0
        favorite:
          type: boolean
        lastPlayedAt:
          $ref: "#/components/schemas/Timestamp"
        unplayedCount:
          type: integer
          minimum: 0
          description: For series, seasons and albums, the number of children
            not yet played.

    ExternalIds:
      description: IDs of this item in public databases.
      type: object
      properties:
        tmdb:
          type: string
        imdb:
          type: string
        tvdb:
          type: string
        musicBrainz:
          type: string
      additionalProperties:
        type: string

    ItemRef:
      description: A minimal pointer to another item.
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string

    Credit:
      description: A person's part in an item.
      type: object
      required: [person, role]
      properties:
        person:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
            image:
              $ref: "#/components/schemas/ImageRef"
        role:
          type: string
          description: Open set; clients must handle unknown values.
          examples: [actor, director, writer, producer, composer, guestStar]
        character:
          type: string

    Chapter:
      type: object
      required: [startMs]
      properties:
        name:
          type: string
        startMs:
          $ref: "#/components/schemas/Milliseconds"
        image:
          $ref: "#/components/schemas/ImageRef"

    ItemSummary:
      description: The light shape used in lists, rows and grids.
      type: object
      required: [id, kind, name]
      properties:
        id:
          type: string
          examples: [item_7f3a9c04b1e2]
        kind:
          $ref: "#/components/schemas/ItemKind"
        name:
          type: string
        premiereDate:
          $ref: "#/components/schemas/CalendarDate"
        year:
          type: integer
        durationMs:
          $ref: "#/components/schemas/Milliseconds"
        officialRating:
          type: string
          description: Age rating as published, e.g. `PG-13` or `TV-MA`.
        images:
          $ref: "#/components/schemas/Images"
        userState:
          $ref: "#/components/schemas/UserState"
        # Kind-specific parts. At most one is present: the one matching `kind`.
        movie:
          $ref: "#/components/schemas/MoviePart"
        series:
          $ref: "#/components/schemas/SeriesPart"
        season:
          $ref: "#/components/schemas/SeasonPart"
        episode:
          $ref: "#/components/schemas/EpisodePart"
        collection:
          $ref: "#/components/schemas/CountPart"
        musicVideo:
          $ref: "#/components/schemas/MusicVideoPart"
        musicArtist:
          $ref: "#/components/schemas/MusicArtistPart"
        musicAlbum:
          $ref: "#/components/schemas/MusicAlbumPart"
        track:
          $ref: "#/components/schemas/TrackPart"
        playlist:
          $ref: "#/components/schemas/PlaylistPart"
        audiobook:
          $ref: "#/components/schemas/AudiobookPart"
        book:
          $ref: "#/components/schemas/BookPart"
        photo:
          $ref: "#/components/schemas/PhotoPart"
        photoAlbum:
          $ref: "#/components/schemas/CountPart"
        liveChannel:
          $ref: "#/components/schemas/LiveChannelPart"
        liveProgram:
          $ref: "#/components/schemas/LiveProgramPart"
        recording:
          $ref: "#/components/schemas/RecordingPart"

    Item:
      description: The full shape, used on detail pages.
      allOf:
        - $ref: "#/components/schemas/ItemSummary"
        - type: object
          properties:
            overview:
              type: string
              description: Plain text; never contains markup.
            genres:
              type: array
              items:
                type: string
            studios:
              type: array
              items:
                type: string
            communityRating:
              type: number
              minimum: 0
              maximum: 10
            criticRating:
              type: number
              minimum: 0
              maximum: 100
            credits:
              type: array
              items:
                $ref: "#/components/schemas/Credit"
            chapters:
              type: array
              items:
                $ref: "#/components/schemas/Chapter"
            externalIds:
              $ref: "#/components/schemas/ExternalIds"
            tags:
              type: array
              description: Absent unless the operator turns tags on; operators
                often use tags for internal purposes.
              items:
                type: string

    ItemPage:
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ItemSummary"
            seed:
              type: string
              description: For random order, the seed used. Put it in the
                page's URL to keep the same shuffle after a reload.

    Library:
      type: object
      required: [id, name, kind]
      properties:
        id:
          type: string
          examples: [lib_2h7d9k4m1p6s]
        name:
          type: string
        kind:
          type: string
          description: Open set; clients must handle unknown values.
          examples: [movies, shows, music, books, photos, homeVideos, liveTv, mixed]
        image:
          $ref: "#/components/schemas/ImageRef"

    Genre:
      type: object
      required: [name]
      properties:
        name:
          type: string
        itemCount:
          type: integer
          minimum: 0

    Person:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          examples: [pers_5t8w1n3k7q2z]
        name:
          type: string
        overview:
          type: string
          description: Plain text.
        image:
          $ref: "#/components/schemas/ImageRef"
        birthDate:
          $ref: "#/components/schemas/CalendarDate"
        deathDate:
          $ref: "#/components/schemas/CalendarDate"
        externalIds:
          $ref: "#/components/schemas/ExternalIds"

    Lyrics:
      type: object
      required: [timed, lines]
      properties:
        timed:
          type: boolean
          description: Whether lines carry start times (for karaoke-style
            display).
        lines:
          type: array
          items:
            type: object
            required: [text]
            properties:
              text:
                type: string
              startMs:
                $ref: "#/components/schemas/Milliseconds"

    Trickplay:
      description: |
        One set of seek-bar previews. Each sheet is a grid of `columns` x
        `rows` tiles, read left to right and top to bottom; tile n shows the
        video at n x `intervalMs`.
      type: object
      required: [tileWidth, tileHeight, columns, rows, intervalMs, tileCount, sheets]
      properties:
        tileWidth:
          type: integer
          minimum: 1
        tileHeight:
          type: integer
          minimum: 1
        columns:
          type: integer
          minimum: 1
        rows:
          type: integer
          minimum: 1
        intervalMs:
          $ref: "#/components/schemas/Milliseconds"
        tileCount:
          type: integer
          minimum: 0
        sheets:
          type: array
          items:
            type: string
            format: uri-reference

    SearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 200
        sources:
          type: array
          description: Which sections to return. Default is all available.
          items:
            type: string
            enum: [library, catalog]
        kind:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/ItemKind"
        limit:
          type: integer
          minimum: 1
          maximum: 50
          default: 20

    SearchResults:
      type: object
      properties:
        library:
          type: array
          items:
            $ref: "#/components/schemas/ItemSummary"
        catalog:
          description: Present only when the TMDB catalog is enabled and
            asked for.
          type: array
          items:
            $ref: "#/components/schemas/CatalogTitle"

    CatalogTitle:
      description: A title known from TMDB, in the library or not. If it is
        in the library, `libraryItemId` points to it, so a site can show Play
        instead of Request.
      type: object
      required: [tmdbId, mediaKind, name, availability]
      properties:
        tmdbId:
          type: string
        mediaKind:
          type: string
          description: Open set.
          examples: [movie, series]
        name:
          type: string
        year:
          type: integer
        overview:
          type: string
          description: Plain text.
        image:
          $ref: "#/components/schemas/ImageRef"
        availability:
          type: string
          description: How much of it the library has. Open set.
          examples: [available, partiallyAvailable, missing]
        requestStatus:
          type: string
          description: Present only when requests are enabled. Open set.
          examples: [requested, processing, declined]
        libraryItemId:
          type: string

    # ---- Catalog and requests -----------------------------------------------

    CatalogDetail:
      allOf:
        - $ref: "#/components/schemas/CatalogTitle"
        - type: object
          properties:
            officialRating:
              type: string
              description: Age rating in the instance's ratings country.
            genres:
              type: array
              items:
                type: string
            backdrop:
              $ref: "#/components/schemas/ImageRef"
            cast:
              type: array
              items:
                type: object
                required: [name]
                properties:
                  name:
                    type: string
                  character:
                    type: string
                  image:
                    $ref: "#/components/schemas/ImageRef"
            seasons:
              type: array
              description: For series, each season's status.
              items:
                type: object
                required: [number, availability]
                properties:
                  number:
                    type: integer
                    minimum: 0
                  name:
                    type: string
                  episodeCount:
                    type: integer
                    minimum: 0
                  availability:
                    type: string
                    description: Same open set as
                      `CatalogTitle.availability`.
                  requestStatus:
                    type: string
                    description: Same open set as
                      `CatalogTitle.requestStatus`.

    MediaRequest:
      type: object
      required: [id, title, status, requestedAt]
      properties:
        id:
          type: string
          examples: [req_4n7x2k9m5q1w]
        title:
          $ref: "#/components/schemas/CatalogTitle"
        seasons:
          type: array
          items:
            type: integer
            minimum: 0
        status:
          type: string
          description: Open set; clients must handle unknown values.
          examples: [pending, approved, declined, processing, available, failed]
        requestedAt:
          $ref: "#/components/schemas/Timestamp"
        profileName:
          type: string
          description: Which of the account's own profiles made it; shown to
            the owner for kids profiles.

    Quota:
      type: object
      properties:
        movie:
          $ref: "#/components/schemas/QuotaPart"
        series:
          $ref: "#/components/schemas/QuotaPart"

    QuotaPart:
      description: Absent `limit` means unlimited.
      type: object
      properties:
        limit:
          type: integer
          minimum: 0
        used:
          type: integer
          minimum: 0
        periodDays:
          type: integer
          minimum: 1

    IssueReport:
      type: object
      required: [kind]
      properties:
        itemId:
          type: string
          description: The library item. Use this or `tmdbId`.
          maxLength: 64
        tmdbId:
          type: string
          pattern: "^[0-9]{1,12}$"
        kind:
          type: string
          enum: [video, audio, subtitles, other]
        reason:
          type: string
          description: A preset reason sites can offer as quick choices. Open
            set; more may be added.
          enum: [wontPlay, badQuality, outOfSync, wrongLanguage, missing, other]
        message:
          type: string
          maxLength: 2000
        positionMs:
          $ref: "#/components/schemas/Milliseconds"

    Issue:
      type: object
      required: [id, kind, status, createdAt]
      properties:
        id:
          type: string
          examples: [iss_8c3m6t1k9w2p]
        item:
          $ref: "#/components/schemas/ItemSummary"
        kind:
          type: string
        reason:
          type: string
        message:
          type: string
        status:
          type: string
          description: Open set.
          examples: [open, resolved]
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        comments:
          type: array
          description: Only with conversations enabled. Replies from the
            operator are labeled as such; other users never appear.
          items:
            type: object
            required: [message, fromOperator, createdAt]
            properties:
              message:
                type: string
              fromOperator:
                type: boolean
              createdAt:
                $ref: "#/components/schemas/Timestamp"

    # ---- Playback -----------------------------------------------------------

    Capabilities:
      description: |
        What the playing device can handle. The JavaScript SDK fills this in
        from the browser. Unknown values are ignored, so clients can declare
        new codecs or formats without breaking anything.
      type: object
      properties:
        containers:
          type: array
          items:
            type: string
          examples: [[mp4, webm, mkv]]
        videoCodecs:
          type: array
          items:
            type: string
          examples: [[h264, hevc, av1, vp9]]
        audioCodecs:
          type: array
          items:
            type: string
          examples: [[aac, opus, flac, eac3]]
        maxHeight:
          type: integer
          minimum: 144
        hdr:
          type: array
          items:
            type: string
          examples: [[hdr10, dolbyVision]]
        subtitles:
          type: array
          description: Subtitle formats the client renders itself; anything
            else is converted or burned in.
          items:
            type: string
          examples: [[vtt, ass, pgs]]
        maxAudioChannels:
          type: integer
          minimum: 1
        maxBitrateKbps:
          type: integer
          minimum: 64

    PlaybackStart:
      type: object
      required: [itemId, capabilities]
      properties:
        itemId:
          type: string
          maxLength: 64
        capabilities:
          $ref: "#/components/schemas/Capabilities"
        startPositionMs:
          $ref: "#/components/schemas/Milliseconds"
        versionId:
          type: string
          description: Which version of the item, when it has several.
          maxLength: 64
        audioTrack:
          type: string
          maxLength: 64
        subtitleTrack:
          type: string
          description: A subtitle track ID, or `off`.
          maxLength: 64
        maxBitrateKbps:
          type: integer
          minimum: 64
        queue:
          type: array
          description: Items to play after this one (next episodes, an
            album's tracks).
          maxItems: 1000
          items:
            type: string
            maxLength: 64
        device:
          type: string
          description: A readable name for this device, shown when another
            device takes over.
          maxLength: 64

    PlaybackChange:
      type: object
      minProperties: 1
      properties:
        versionId:
          type: string
          maxLength: 64
        audioTrack:
          type: string
          maxLength: 64
        subtitleTrack:
          type: string
          maxLength: 64
        maxBitrateKbps:
          type: integer
          minimum: 64

    ProgressReport:
      type: object
      required: [positionMs]
      properties:
        positionMs:
          $ref: "#/components/schemas/Milliseconds"
        paused:
          type: boolean
        ended:
          type: boolean
          description: True when the item played to its end.

    Track:
      type: object
      required: [id, label]
      properties:
        id:
          type: string
        label:
          type: string
          description: Readable, e.g. `English (5.1)` or `Français, forced`.
        language:
          type: string
          description: BCP 47 language tag, when known.
        codec:
          type: string
        channels:
          type: integer
          minimum: 1
        default:
          type: boolean
        forced:
          type: boolean
        hearingImpaired:
          type: boolean
        url:
          type: string
          format: uri-reference
          description: For subtitles delivered separately, the WebVTT URL.

    MediaSegment:
      description: A marked part of the media, e.g. for a "Skip intro"
        button.
      type: object
      required: [kind, startMs, endMs]
      properties:
        kind:
          type: string
          description: Open set; clients must handle unknown values.
          examples: [intro, outro, recap, preview, commercial]
        startMs:
          $ref: "#/components/schemas/Milliseconds"
        endMs:
          $ref: "#/components/schemas/Milliseconds"

    PlaybackSession:
      type: object
      required: [id, item, method, stream, positionMs]
      properties:
        id:
          type: string
          examples: [play_9m2k7w4q1x8c]
        item:
          $ref: "#/components/schemas/ItemSummary"
        method:
          type: string
          description: How the media reaches the client. Open set.
          examples: [direct, remux, transcode]
        stream:
          type: object
          required: [url, protocol]
          properties:
            url:
              type: string
              format: uri-reference
            protocol:
              type: string
              description: Open set.
              examples: [file, hls]
            mimeType:
              type: string
        positionMs:
          $ref: "#/components/schemas/Milliseconds"
        durationMs:
          $ref: "#/components/schemas/Milliseconds"
        versions:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
              name:
                type: string
        versionId:
          type: string
        audioTracks:
          type: array
          items:
            $ref: "#/components/schemas/Track"
        audioTrack:
          type: string
        subtitleTracks:
          type: array
          items:
            $ref: "#/components/schemas/Track"
        subtitleTrack:
          type: string
        maxBitrateKbps:
          type: integer
        segments:
          type: array
          items:
            $ref: "#/components/schemas/MediaSegment"
        queue:
          type: object
          required: [items, index]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ItemSummary"
            index:
              type: integer
              minimum: 0
              description: The entry playing now.

    # ---- Kind-specific parts -----------------------------------------------

    MoviePart:
      type: object
      properties:
        originalTitle:
          type: string
        tagline:
          type: string

    SeriesPart:
      type: object
      properties:
        status:
          type: string
          description: Open set; clients must handle unknown values.
          examples: [continuing, ended]
        seasonCount:
          type: integer
          minimum: 0
        episodeCount:
          type: integer
          minimum: 0
        endDate:
          $ref: "#/components/schemas/CalendarDate"

    SeasonPart:
      type: object
      required: [seriesId]
      properties:
        seriesId:
          type: string
        seriesName:
          type: string
        number:
          type: integer
          minimum: 0
          description: 0 is the specials season.
        episodeCount:
          type: integer
          minimum: 0

    EpisodePart:
      type: object
      required: [seriesId]
      properties:
        seriesId:
          type: string
        seriesName:
          type: string
        seasonId:
          type: string
        seasonNumber:
          type: integer
          minimum: 0
        number:
          type: integer
          minimum: 0
        numberEnd:
          type: integer
          minimum: 0
          description: Last episode number, for files covering several
            episodes.

    CountPart:
      description: For containers whose only specific field is a count.
      type: object
      properties:
        itemCount:
          type: integer
          minimum: 0

    MusicVideoPart:
      type: object
      properties:
        artists:
          type: array
          items:
            $ref: "#/components/schemas/ItemRef"

    MusicArtistPart:
      type: object
      properties:
        albumCount:
          type: integer
          minimum: 0
        trackCount:
          type: integer
          minimum: 0

    MusicAlbumPart:
      type: object
      properties:
        albumArtists:
          type: array
          items:
            $ref: "#/components/schemas/ItemRef"
        trackCount:
          type: integer
          minimum: 0
        normalizationGainDb:
          type: number
          description: Loudness adjustment for the whole album, in decibels.

    TrackPart:
      type: object
      properties:
        album:
          $ref: "#/components/schemas/ItemRef"
        artists:
          type: array
          items:
            $ref: "#/components/schemas/ItemRef"
        albumArtists:
          type: array
          items:
            $ref: "#/components/schemas/ItemRef"
        number:
          type: integer
          minimum: 0
        discNumber:
          type: integer
          minimum: 0
        normalizationGainDb:
          type: number
          description: Loudness adjustment for this track, in decibels.
        hasLyrics:
          type: boolean

    PlaylistPart:
      type: object
      properties:
        mediaKind:
          type: string
          description: Open set; clients must handle unknown values.
          examples: [video, audio, mixed]
        itemCount:
          type: integer
          minimum: 0

    AudiobookPart:
      type: object
      properties:
        authors:
          type: array
          items:
            $ref: "#/components/schemas/ItemRef"
        narrators:
          type: array
          items:
            $ref: "#/components/schemas/ItemRef"

    BookPart:
      type: object
      properties:
        authors:
          type: array
          items:
            $ref: "#/components/schemas/ItemRef"

    PhotoPart:
      description: |
        Only what an album view needs. `takenAt`, `location` and `camera` are
        privacy-sensitive: they are absent unless the operator turns each one
        on. Image files themselves are always stripped of embedded metadata.
      type: object
      properties:
        album:
          $ref: "#/components/schemas/ItemRef"
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        takenAt:
          $ref: "#/components/schemas/Timestamp"
        location:
          type: object
          required: [latitude, longitude]
          properties:
            latitude:
              type: number
              minimum: -90
              maximum: 90
            longitude:
              type: number
              minimum: -180
              maximum: 180
            altitudeM:
              type: number
        camera:
          type: object
          properties:
            make:
              type: string
            model:
              type: string

    LiveChannelPart:
      type: object
      properties:
        number:
          type: string
          description: The channel number as displayed, e.g. `5.1`.

    LiveProgramPart:
      type: object
      required: [channelId, startAt, endAt]
      properties:
        channelId:
          type: string
        startAt:
          $ref: "#/components/schemas/Timestamp"
        endAt:
          $ref: "#/components/schemas/Timestamp"

    RecordingPart:
      type: object
      properties:
        channelId:
          type: string
        recordedAt:
          $ref: "#/components/schemas/Timestamp"

  responses:
    UserStateChanged:
      description: The active profile's updated state for the item.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UserState"
    PlaybackEnded:
      description: |
        This playback no longer exists. With `playback-taken-over`, another
        device of the same account started playing; `takenOverBy` names it,
        so the site can offer to continue here. With `playback-expired`, it
        stopped reporting progress for too long.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                properties:
                  takenOverBy:
                    type: string
                    description: The other device's name.
    NotFound:
      description: The resource doesn't exist, or the caller may not see it.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Not logged in (`not-authenticated`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    StepUpRequired:
      description: A fresh confirmation is needed (`step-up-required`); see
        `stepUp` and `stepUpUrl`. Also used for a wrong PIN (`pin-incorrect`)
        and a locked PIN (`pin-locked`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The request clashes with existing data, e.g. a profile name
        already used in this account (`name-taken`) or the profile limit
        reached (`profile-limit-reached`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooLarge:
      description: The upload is too big in bytes or dimensions
        (`upload-too-large`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedImage:
      description: The upload isn't a JPEG, PNG or WebP image that decodes
        cleanly (`unsupported-image`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
