# Overfin and its own Jellyfin, on one machine. Copy .env.example to .env,
# set where your media is, then: docker compose up -d. Open this machine's
# address in a browser, and the setup wizard takes it from there. See
# README.md.
#
# Overfin reaches Jellyfin on this project's network only; nothing else
# does. Nothing gets the Docker socket.
name: overfin

services:
  overfin:
    container_name: overfin
    image: ${OVERFIN_IMAGE:-ghcr.io/overfin/overfin:0.4.0}
    # From a checkout of the repository: docker compose build overfin
    build: ..
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      OVERFIN_JELLYFIN_URL: http://jellyfin:8096
      # With a domain pointed at this machine, Overfin gets its own HTTPS
      # certificate; without one, it serves plain http (keep that to your
      # LAN).
      OVERFIN_DOMAIN: ${OVERFIN_DOMAIN:-}
      # Optional: TMDB's read access token here, or in the setup wizard.
      OVERFIN_TMDB_TOKEN: ${OVERFIN_TMDB_TOKEN:-}
    volumes:
      - overfin-data:/data
      # Overfin's secret key, made on its first start.
      - overfin-secrets:/secrets
    ports:
      - "80:8080"
      - "443:8443"
    depends_on:
      jellyfin:
        condition: service_healthy

  jellyfin:
    container_name: jellyfin
    # The version Overfin was tested with; newer ones come with Overfin's
    # releases.
    image: docker.io/jellyfin/jellyfin:${JELLYFIN_TAG:-12.2.20261005-225228}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      # Your films and series, read only: in Overfin's control panel, add
      # libraries with folders under /media.
      - ${MEDIA_DIR:?set MEDIA_DIR in .env (see .env.example)}:/media:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8096/health"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6
    # Jellyfin itself is closed: Overfin is the only one that talks to it.
    # To look inside while access is open (control panel, Server), publish
    # it on this machine only, then recreate it (docker compose up -d):
    # ports:
    #   - "127.0.0.1:8096:8096"
    # For your LAN instead, put this machine's LAN address before :8096.
    #
    # A GPU for converting videos, then choose it in the control panel
    # (Server, Transcoding). Intel or AMD:
    # devices:
    #   - /dev/dri:/dev/dri
    # NVIDIA (with the NVIDIA Container Toolkit installed):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  overfin-data:
  overfin-secrets:
  jellyfin-config:
  jellyfin-cache:
