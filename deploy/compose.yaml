# Overfin with everything it needs, on one machine: Caddy (HTTPS), Authentik
# (logins) and Authentik's database. Run ./setup.sh first: it writes .env
# and overfin.toml. See README.md.
#
# Each container gets only the secrets it uses, Authentik's database is on
# a network only Authentik reaches, and nothing gets the Docker socket.
name: overfin

services:
  caddy:
    image: docker.io/library/caddy:${CADDY_TAG:-2}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      OVERFIN_DOMAIN: ${OVERFIN_DOMAIN:?run ./setup.sh first}
      AUTH_DOMAIN: ${AUTH_DOMAIN:?run ./setup.sh first}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge:
        ipv4_address: ${CADDY_IP:?run ./setup.sh first}
        # Overfin reaches the sign-in by its public name, through Caddy, so
        # HTTPS is checked as everywhere else.
        aliases:
          - ${AUTH_DOMAIN}

  overfin:
    image: ${OVERFIN_IMAGE:?run ./setup.sh first}
    # From a checkout of the repository: docker compose build overfin
    build: ..
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      OVERFIN_SECRET_KEY: ${OVERFIN_SECRET_KEY:?run ./setup.sh first}
      OVERFIN_JELLYFIN_ADMIN_KEY: ${OVERFIN_JELLYFIN_ADMIN_KEY:?run ./setup.sh first}
      OVERFIN_OIDC_CLIENT_SECRET: ${OVERFIN_OIDC_CLIENT_SECRET:?run ./setup.sh first}
      OVERFIN_CONNECTOR_TOKEN: ${OVERFIN_CONNECTOR_TOKEN:?run ./setup.sh first}
    volumes:
      - ./overfin.toml:/etc/overfin/overfin.toml:ro,z
      - overfin-data:/data
    ports:
      # The control panel, on this machine only: reach it through an SSH
      # tunnel. Never publish it on another address.
      - "127.0.0.1:8081:8081"
    networks: [edge]
    depends_on: [caddy]

  authentik-server:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG:?run ./setup.sh first}
    command: server
    restart: unless-stopped
    shm_size: 512mb
    environment: &authentik
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?run ./setup.sh first}
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS:?run ./setup.sh first}
      # Only read on the very first start, to create the admin (akadmin).
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-}
      # For the Overfin blueprint (authentik/overfin.yaml).
      OVERFIN_DOMAIN: ${OVERFIN_DOMAIN}
      OVERFIN_SITE_NAME: ${OVERFIN_SITE_NAME:-}
      OVERFIN_ADMIN_GROUP: ${OVERFIN_ADMIN_GROUP:-overfin-admins}
      OVERFIN_OIDC_CLIENT_SECRET: ${OVERFIN_OIDC_CLIENT_SECRET}
      OVERFIN_CONNECTOR_TOKEN: ${OVERFIN_CONNECTOR_TOKEN}
    volumes:
      - authentik-data:/data
      - ./authentik:/blueprints/custom:ro,z
    networks: [edge, authentik]
    depends_on:
      postgresql:
        condition: service_healthy

  authentik-worker:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG}
    command: worker
    restart: unless-stopped
    shm_size: 512mb
    environment: *authentik
    volumes:
      - authentik-data:/data
      - ./authentik:/blueprints/custom:ro,z
    networks: [authentik]
    depends_on:
      postgresql:
        condition: service_healthy

  postgresql:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: authentik
      POSTGRES_DB: authentik
      POSTGRES_PASSWORD: ${PG_PASS}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d authentik -U authentik"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - database:/var/lib/postgresql/data
    networks: [authentik]

networks:
  # Caddy, Overfin and Authentik's server. Automatic addresses come from
  # EDGE_RANGE only, so Caddy's fixed one (CADDY_IP, outside it) is never
  # handed to another container while Caddy restarts.
  edge:
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:?run ./setup.sh first}
          ip_range: ${EDGE_RANGE:?run ./setup.sh first}
  # Authentik and its database only.
  authentik: {}

volumes:
  caddy-data:
  caddy-config:
  overfin-data:
  authentik-data:
  database:
