# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
#
# Overfin's side of Authentik, in one blueprint: its login client, a login
# flow with the username and password on one page, the group of Overfin's
# admins, and the connector's user, allowed only to view users.
#
# Authentik applies it by itself from /blueprints/custom (the compose bundle
# mounts it there), reading these environment variables:
#   OVERFIN_DOMAIN               the site's domain, e.g. example.org
#   OVERFIN_SITE_NAME            the name people see, e.g. "Movie night"
#   OVERFIN_OIDC_CLIENT_SECRET   Overfin's client secret
#   OVERFIN_CONNECTOR_TOKEN      the connector's API token
# Authentik's default flows are left as they are.
version: 1
metadata:
  name: Overfin
  labels:
    blueprints.goauthentik.io/description: "Overfin: its login client and flow, its admins group, and its connector"
entries:
  # ---- Logging in ------------------------------------------------------------

  # Username and password on one page, which password managers fill best,
  # then the second factor if the person has one, then the session.
  - model: authentik_stages_identification.identificationstage
    id: identification
    identifiers:
      name: overfin-identification
    attrs:
      user_fields: [username, email]
      password_stage: !Find [authentik_stages_password.passwordstage, [name, default-authentication-password]]
      case_insensitive_matching: true
      pretend_user_exists: true

  - model: authentik_flows.flow
    id: login-flow
    identifiers:
      slug: overfin-authentication
    attrs:
      name: Overfin login
      title: !Env [OVERFIN_SITE_NAME, Welcome]
      designation: authentication
      authentication: none

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf login-flow
      stage: !KeyOf identification
    attrs:
      order: 10

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf login-flow
      stage: !Find [authentik_stages_authenticator_validate.authenticatorvalidatestage, [name, default-authentication-mfa-validation]]
    attrs:
      order: 30

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf login-flow
      stage: !Find [authentik_stages_user_login.userloginstage, [name, default-authentication-login]]
    attrs:
      order: 100

  # ---- Overfin's client ------------------------------------------------------

  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: Overfin
    attrs:
      authentication_flow: !KeyOf login-flow
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: overfin
      client_secret: !Env OVERFIN_OIDC_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: !Format ["https://%s/api/v1/auth/callback", !Env OVERFIN_DOMAIN]
        # The control panel, reached through an SSH tunnel.
        - matching_mode: strict
          url: http://localhost:8081/admin/auth/callback
      # openid, email, profile (with the groups) and refresh tokens.
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: hashed_user_id
      issuer_mode: per_provider

  - model: authentik_core.application
    identifiers:
      slug: overfin
    attrs:
      name: !Env [OVERFIN_SITE_NAME, Media]
      provider: !KeyOf provider
      meta_launch_url: !Format ["https://%s/", !Env OVERFIN_DOMAIN]
      policy_engine_mode: any

  # ---- Overfin's admins ------------------------------------------------------

  # Members may sign in to Overfin's control panel. Created once, with the
  # initial admin in it; who's in it afterwards is up to the operator.
  - model: authentik_core.group
    state: created
    identifiers:
      name: overfin-admins
    attrs:
      users:
        - !Find [authentik_core.user, [username, akadmin]]

  # ---- The connector ---------------------------------------------------------

  # Reads people's names for the control panel, and nothing else.
  - model: authentik_core.user
    id: connector
    identifiers:
      username: overfin-connector
    attrs:
      name: Overfin connector
      type: service_account
      path: overfin
      permissions:
        - authentik_core.view_user

  - model: authentik_core.token
    identifiers:
      identifier: overfin-connector
    attrs:
      user: !KeyOf connector
      intent: api
      expiring: false
      key: !Env OVERFIN_CONNECTOR_TOKEN
      description: Overfin reads names for its control panel
