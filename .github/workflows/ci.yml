# Checks every push and pull request: formatting, vet, static analysis,
# known vulnerabilities, tests (with the race detector, and the check that
# the API specification matches the routes), the JavaScript SDK's tests, and
# that the API specification is valid YAML.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Static analysis
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...

      - name: Known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Tests
        run: go test -race ./...

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: SDK tests
        run: node --test sdk/js/overfin.test.js

      - name: API specification
        run: |
          python3 -c "import yaml" 2>/dev/null ||
            python3 -m pip install --quiet --user --break-system-packages pyyaml
          python3 -c "import yaml; yaml.safe_load(open('api/openapi.yaml'))"
