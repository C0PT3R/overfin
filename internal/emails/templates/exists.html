{{define "content" -}}
<p style="margin:0 0 20px;">{{t "exists.intro"}}</p>
<p style="margin:0 0 20px;"><a href="{{.Link}}" style="display:inline-block; padding:10px 22px; border-radius:8px; background:{{index .Light "accent"}}; color:{{index .Light "on-accent"}}; font-weight:700; text-decoration:none;">{{t "exists.button"}}</a></p>
<p style="margin:0 0 4px; font-size:13px; color:{{index .Light "muted"}};">{{t "linkText"}}</p>
<p style="margin:0 0 16px; font-size:13px; word-break:break-all;"><a href="{{.Link}}" style="color:{{index .Light "accent"}};">{{.Link}}</a></p>
{{- with t "exists.expires"}}
<p style="margin:0;">{{.}}</p>
{{- end}}
{{- end}}
{{define "why"}}{{t "exists.why"}}{{end}}
