# Overfin configuration example.
#
# Overfin runs without any file: everything has a default, and the setup page
# in the browser asks for the rest. Copy to /etc/overfin/overfin.toml only to
# change them. Changes apply on restart, or live on SIGHUP (docker kill -s
# HUP overfin) except listen, storage.path, jellyfin.url, [https], [admin]
# and the secret key. Secrets never go in this file; set them as
# environment variables (or NAME_FILE pointing to a file, for Docker secrets):
#
#   OVERFIN_SECRET_KEY           optional: base64, at least 32 random bytes
#                                (openssl rand -base64 32). Without it,
#                                Overfin generates one on its first start, in
#                                /secrets/overfin.key (back it up).
#   OVERFIN_OIDC_CLIENT_SECRET   with [oidc]: the client secret at the
#                                identity provider
#   OVERFIN_CONNECTOR_TOKEN      with [connector]: the identity provider API
#                                token
#   OVERFIN_MAIL_PASSWORD        with mail.username: the SMTP password

# Address Overfin listens on: the site, over plain http. With [https], only
# Let's Encrypt's checks, and a redirect to HTTPS for everyone else.
listen = ":8080"

[https]
# Overfin serves HTTPS itself, with a certificate it gets from Let's Encrypt
# and renews: set the site's domain, pointed at this server, with ports 80
# and 443 reachable from the internet (in Docker: -p 80:8080 -p 443:8443).
# Or set OVERFIN_DOMAIN in the environment instead. Leave it empty behind
# your own reverse proxy, or for plain http on a LAN.
domain = ""                     # e.g. "media.example.org"
listen = ":8443"
email = ""                      # optional: Let's Encrypt's contact

[jellyfin]
# Where Overfin reaches its own Jellyfin (SECURITY.md rule 67), on your
# media; keeping it off the internet is recommended. A fresh Jellyfin,
# Overfin sets up itself when it starts, and makes its own key there, kept
# sealed in the database. One already set up, Overfin takes only if you hand
# it over in the setup wizard, with its administrator's login. Without an
# address here (or in OVERFIN_JELLYFIN_URL), the wizard asks for it. The
# wizard needs the one-time code from Overfin's log; it's at /admin/ on the
# site's own address with managed sign-in (where it also makes the first
# admin), and on the control panel's.
url = "http://192.0.2.10:8096"

[identity]
# How users log in:
#   "managed"      the default: Overfin signs people in itself, with their
#                  email and a code it sends there ([mail]), or a password
#                  they set. Nothing else to set up; [oidc] is then unused.
#   "oidc"         Overfin logs them in with the identity provider in [oidc]
#                  (recommended: one client registration for login and
#                  step-up, no identity headers to trust).
#   "forwardauth"  a reverse proxy authenticates users and passes identity
#                  headers (user_header, groups_header below).
#   "anonymous"    no login at all.
mode = "oidc"
# The reverse proxies in front of Overfin: the client address is taken from
# them, and in forwardauth mode the identity headers too.
trusted_proxies = ["198.51.100.7"]
# Only members of this group get an account. Leave empty to allow everyone
# who can log in.
required_group = "media-users"
# Where users go to also leave the identity provider when they log out. In
# oidc mode, leave empty to use the provider's own end-session address.
logout_url = ""

# forwardauth mode only: headers the proxy sets with the user's stable ID and
# groups. They depend on the proxy, for example:
#   Authentik:  X-Authentik-Uid   and  X-Authentik-Groups
#   Authelia:   Remote-User       and  Remote-Groups
# user_header = "Remote-User"
# groups_header = "Remote-Groups"
# What separates groups in that header: "|" for Authentik, "," for Authelia.
# groups_separator = ","

[oidc]
# Overfin's registration at the identity provider: a confidential
# OAuth2/OpenID client with the redirect URL below, and in forwardauth mode a
# subject equal to the user ID the proxy sends. Recommended: allow refresh
# tokens (usually the offline_access scope), so logins are re-checked every
# few minutes; without them a login simply lasts 12 hours. Set
# OVERFIN_OIDC_CLIENT_SECRET. In forwardauth mode this section is optional
# and only enables step-up: without it, destructive actions (deleting a
# profile, changing or removing a PIN) are refused, and a locked PIN unlocks
# by itself after 15 minutes.
issuer = "https://auth.example.org/application/o/site/"
client_id = "overfin"
redirect_url = "https://example.org/api/v1/auth/callback"
# Optional "host:port" to reach the provider at, such as the reverse proxy
# both sit behind; TLS is still checked against the issuer's name.
dial = ""
# How long a confirmed login counts as fresh for destructive actions.
fresh_for_minutes = 5
# How often a login is confirmed again with the provider, when it gives
# refresh tokens: a user disabled there is out within this time.
recheck_minutes = 10
# The ID token claim listing the user's groups (oidc mode, with
# required_group).
groups_claim = "groups"

[storage]
path = "/data/overfin.db"

[mail]
# Managed sign-in only: the SMTP server sign-in codes are sent through.
# Without it, people sign in with a password. Off when host is empty.
host = ""                       # e.g. "smtp.example.org"
port = 587                      # 587 for starttls, 465 for tls
tls = "starttls"                # "starttls", "tls", or "none" (a relay on
                                # the local network, without a password)
from = ""                       # e.g. "Media <media@example.org>"
username = ""                   # with OVERFIN_MAIL_PASSWORD

[admin]
# With managed sign-in, the control panel is at /admin/ on the site's own
# address, for admins, who confirm it's them before going in; nothing to set
# here, except, to keep it to private addresses (LAN, VPN):
# private = true
# or, to take it off the site entirely, onto a listener of its own that
# answers private addresses only (admins sign in there, at
# http://<that address>/admin/):
# listen = ":8081"
#
# With an identity provider (oidc or forwardauth mode):
# Overfin's control panel, on its own listener: never on the internet. It
# answers only private addresses (LAN, VPN, an SSH tunnel), and only members
# of `group` may sign in, through the [oidc] provider. Register
# `redirect_url` there too. Off when `listen` is empty.
#
# Through an SSH tunnel (no certificate needed): publish the port on the
# server's 127.0.0.1 only, run `ssh -L 8081:localhost:8081 server`, and open
# http://localhost:8081.
# On a LAN or VPN instead: an https:// redirect_url, with tls_cert and
# tls_key for that name.
listen = ""                     # e.g. ":8081"
group = ""                      # e.g. "overfin-admins"
redirect_url = ""               # e.g. "http://localhost:8081/admin/auth/callback"
tls_cert = ""
tls_key = ""

[connector]
# Optional: the identity provider's own API, so the control panel shows who's
# behind each account (live, never stored). Set OVERFIN_CONNECTOR_TOKEN.
# With Pocket ID: its STATIC_API_KEY. Overfin then also sets up, at each
# start, its login client there ([oidc]'s client ID and secret, the site's
# and the panel's return addresses) and the groups named in [admin] and
# [identity]; invitation links lead to a one-person sign-up link (set
# ALLOW_USER_SIGNUPS=withToken in Pocket ID).
# With Authentik: a service account with the global permission "Can view
# User", and a token for it made in Tokens and App passwords with intent
# "API Token" (not an app password).
kind = ""                       # "pocketid" or "authentik"
url = ""                        # e.g. "https://auth.example.org"
dial = ""                       # optional "host:port", as in [oidc]
first_admin = ""                # Pocket ID: while it has nobody, this email
                                # becomes its admin, in the admin group

[site]
# What Overfin serves at the site's root, to logged-in visitors only:
#   "builtin"         overfin-web, Overfin's own web client (the default)
#   "/path/to/folder" your own client's files, read live (no restart needed)
#   "none"            nothing: your proxy serves the site, asking Overfin's
#                     gate (/api/v1/gate) before serving its pages
serve = "builtin"
# The site's Content-Security-Policy. The default fits overfin-web
# (everything from the site itself); your own client may need more sources.
# csp = "default-src 'self'; ..."
# For single-page apps: paths that aren't files get index.html. Always on for
# the built-in client, whose pages have real paths (/item/…).
spa_fallback = false
# The site's public address. Optional: with it, sign-in emails also carry a
# link to sign in with, besides the code.
# url = "https://example.org"

# ---- Feature settings --------------------------------------------------------
# Everything below is switched on and off in the control panel, and lives in
# the database. These sections are only read on the very first start, to fill
# it; after that they're ignored (the log says so) and can be removed.

[limits]
# Playbacks re-encoding the video at once, on the whole server; 0 means no
# cap. Repackaging (remux: only the container or the audio changes) costs
# little and isn't counted.
max_transcodes_total = 4
# 0 means no cap.
max_bitrate_kbps = 0
# Wrong PINs in a row before a profile's PIN locks (3 to 10). The lock lifts
# when the account owner logs in again (with step-up), or after 15 minutes.
pin_attempts = 5
# When an account starts one stream too many: "replace-oldest" stops its
# oldest stream (that device is told why), "refuse" refuses the new one.
on_limit = "replace-oldest"

# Features' own settings, each under its name. Migration lets people bring
# an existing Jellyfin account, with its watch history, by entering its
# username and password once (switch it on in [plugins]). Administrator
# accounts can never be brought over.
[modules.migration]
# "move": bringing an account is one-way. The Jellyfin account gets an opaque
#   name, the lock-down and a new password nobody knows; its old login and
#   Jellyfin apps stop working. When you overfin, you don't fin.
# "link": it keeps its name and password, for a transition period. Move
#   these accounts later from migration's tab in the control panel, once
#   the old way to Jellyfin is closed.
mode = "move"

[accounts]
# When someone deletes their account, its Jellyfin users are "delete"d with
# their watch history (the default), or "disable"d: kept, with their history,
# but unusable. The site tells the person which.
on_delete = "delete"

[plugins]
# The features switched on, besides those always on (accounts and profiles,
# the library, playback, the watchlist). Off by default:
#   migration  people bring their previous account and its history
#   invites    invitation links, made in the control panel
enable = []

[privacy]
# Privacy-sensitive fields stay hidden unless listed here:
#   version.names   names of media versions, derived from file names (otherwise
#                   a neutral description such as "2160p HDR · HEVC" is shown)
#   photo.takenAt, photo.location, photo.camera, item.tags
expose = []
