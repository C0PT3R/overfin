# Overfin configuration example.
#
# Copy to overfin.toml and adjust. Secrets never go in this file; set them as
# environment variables (or NAME_FILE pointing to a file, for Docker secrets):
#
#   OVERFIN_JELLYFIN_ADMIN_KEY   Jellyfin API key, used only to create users
#   OVERFIN_SECRET_KEY           base64, at least 32 random bytes:
#                                  openssl rand -base64 32
#   OVERFIN_OIDC_CLIENT_SECRET   with [oidc]: the client secret at the
#                                identity provider

# Address Overfin listens on.
listen = ":8080"

[jellyfin]
# Where Overfin reaches Jellyfin. Jellyfin itself must not be reachable from
# the internet.
url = "http://192.0.2.10:8096"

[identity]
# How users log in:
#   "oidc"         Overfin logs them in with the identity provider in [oidc]
#                  (recommended: one client registration for login and
#                  step-up, no identity headers to trust).
#   "forwardauth"  a reverse proxy authenticates users and passes identity
#                  headers (user_header, groups_header below).
#   "anonymous"    no login at all.
mode = "oidc"
# The reverse proxies in front of Overfin: the client address is taken from
# them, and in forwardauth mode the identity headers too.
trusted_proxies = ["198.51.100.7"]
# Only members of this group get an account. Leave empty to allow everyone
# who can log in.
required_group = "media-users"
# Where users go to also leave the identity provider when they log out. In
# oidc mode, leave empty to use the provider's own end-session address.
logout_url = ""

# forwardauth mode only: headers the proxy sets with the user's stable ID and
# groups. They depend on the proxy, for example:
#   Authentik:  X-Authentik-Uid   and  X-Authentik-Groups
#   Authelia:   Remote-User       and  Remote-Groups
# user_header = "Remote-User"
# groups_header = "Remote-Groups"
# What separates groups in that header: "|" for Authentik, "," for Authelia.
# groups_separator = ","

[oidc]
# Overfin's registration at the identity provider: a confidential
# OAuth2/OpenID client with the redirect URL below, and in forwardauth mode a
# subject equal to the user ID the proxy sends. Recommended: allow refresh
# tokens (usually the offline_access scope), so logins are re-checked every
# few minutes; without them a login simply lasts 12 hours. Set
# OVERFIN_OIDC_CLIENT_SECRET. In forwardauth mode this section is optional
# and only enables step-up: without it, destructive actions (deleting a
# profile, changing or removing a PIN) are refused, and a locked PIN unlocks
# by itself after 15 minutes.
issuer = "https://auth.example.org/application/o/site/"
client_id = "overfin"
redirect_url = "https://example.org/api/v1/auth/callback"
# Optional "host:port" to reach the provider at, such as the reverse proxy
# both sit behind; TLS is still checked against the issuer's name.
dial = ""
# How long a confirmed login counts as fresh for destructive actions.
fresh_for_minutes = 5
# How often a login is confirmed again with the provider, when it gives
# refresh tokens: a user disabled there is out within this time.
recheck_minutes = 10
# The ID token claim listing the user's groups (oidc mode, with
# required_group).
groups_claim = "groups"

[storage]
path = "/data/overfin.db"

[limits]
max_profiles_per_account = 5
max_streams_per_account = 2
max_transcodes_total = 4
# 0 means no cap.
max_bitrate_kbps = 0
# When an account starts one stream too many: "replace-oldest" stops its
# oldest stream (that device is told why), "refuse" refuses the new one.
on_limit = "replace-oldest"

[adoption]
# Let people bring an existing Jellyfin account, with its watch history, by
# entering its username and password once. Administrator accounts can never
# be brought over. Off by default.
claim = false

[plugins]
# What this instance offers besides accounts and profiles, which are always
# on. Nothing is enabled by default.
#   library    browse libraries, items, "continue watching", posters
#   playback   play items, with subtitles (needs library)
enable = []

[privacy]
# Privacy-sensitive fields stay hidden unless listed here:
#   version.names   names of media versions, derived from file names (otherwise
#                   a neutral description such as "2160p HDR · HEVC" is shown)
#   photo.takenAt, photo.location, photo.camera, item.tags
expose = []
